name: C API

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: C API / ${{ matrix.platform.name }} / ${{ matrix.build_type }}
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - {name: linux-x64, runner: ubuntu-26.04}
          - {name: linux-arm64, runner: ubuntu-26.04-arm}
          - {name: macos-arm64, runner: macos-26}
          - {name: windows-x64, runner: windows-2025-vs2026}
        build_type: [Debug, Release]

    steps:
      - name: Check out repository code
        uses: actions/checkout@v7

      - name: Install GCC on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gcc-15 g++-15

      - name: Install LLVM and libc++ on macOS
        if: runner.os == 'macOS'
        run: brew install llvm@23

      - name: Configure Linux
        if: runner.os == 'Linux'
        run: >-
          cmake -S . -B build-c-api
          -DCMAKE_C_COMPILER=gcc-15 -DCMAKE_CXX_COMPILER=g++-15
          -DCMAKE_CXX_STANDARD=23 -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DBUILD_TESTING=ON -DCPPJIEBA_BUILD_C_API=ON
          -DCPPJIEBA_C_API_BUILD_SHARED=ON -DCPPJIEBA_C_API_BUILD_STATIC=ON
          -DCPPJIEBA_BUILD_LEGACY_TESTS=OFF -DCPPJIEBA_BUILD_EXAMPLES=OFF -DCPPJIEBA_BUILD_BENCHMARKS=OFF

      - name: Configure macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          llvm_prefix="$(brew --prefix llvm@23)"
          cmake -S . -B build-c-api -G Ninja \
            -DCMAKE_C_COMPILER="$llvm_prefix/bin/clang" \
            -DCMAKE_CXX_COMPILER="$llvm_prefix/bin/clang++" \
            -DCMAKE_EXE_LINKER_FLAGS="-L$llvm_prefix/lib/c++ -L$llvm_prefix/lib/unwind -lunwind -Wl,-rpath,$llvm_prefix/lib/c++ -Wl,-rpath,$llvm_prefix/lib/unwind" \
            -DCMAKE_CXX_STANDARD=23 -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DBUILD_TESTING=ON -DCPPJIEBA_BUILD_C_API=ON \
            -DCPPJIEBA_C_API_BUILD_SHARED=ON -DCPPJIEBA_C_API_BUILD_STATIC=ON \
            -DCPPJIEBA_BUILD_LEGACY_TESTS=OFF -DCPPJIEBA_BUILD_EXAMPLES=OFF -DCPPJIEBA_BUILD_BENCHMARKS=OFF

      - name: Configure Windows
        if: runner.os == 'Windows'
        run: >-
          cmake -S . -B build-c-api -G "Visual Studio 18 2026" -A x64
          -DCMAKE_CXX_STANDARD=23
          -DBUILD_TESTING=ON -DCPPJIEBA_BUILD_C_API=ON
          -DCPPJIEBA_C_API_BUILD_SHARED=ON -DCPPJIEBA_C_API_BUILD_STATIC=ON
          -DCPPJIEBA_BUILD_LEGACY_TESTS=OFF -DCPPJIEBA_BUILD_EXAMPLES=OFF -DCPPJIEBA_BUILD_BENCHMARKS=OFF

      - name: Build shared and static C API libraries and tests
        run: >-
          cmake --build build-c-api --config ${{ matrix.build_type }} --parallel 2
          --target test_c_api.run test_c_api_smoke.run test_c_api_static.run test_c_api_static_smoke.run

      - name: Test C API contracts, C hosts, symbols and installed consumers
        run: >-
          ctest --test-dir build-c-api -C ${{ matrix.build_type }} -R "^neo_c_api_"
          --no-tests=error --output-on-failure --output-junit c-api-tests.xml

      - name: Upload C API test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ut-c-api-${{ matrix.platform.name }}-${{ matrix.build_type }}
          path: |
            build-c-api/c-api-tests.xml
            build-c-api/Testing/Temporary/LastTest.log
            build-c-api/c-api-consumer-*/**/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Install C API libraries, headers and package metadata
        run: cmake --install build-c-api/api --config ${{ matrix.build_type }} --prefix c-api-install

      - name: Archive C API package
        # Preserve versioned shared-library symlinks in the uploaded package.
        run: >-
          cmake -E tar czf c-api-${{ matrix.platform.name }}-${{ matrix.build_type }}.tar.gz
          --format=gnutar c-api-install

      - name: Upload C API package
        uses: actions/upload-artifact@v7
        with:
          name: c-api-${{ matrix.platform.name }}-${{ matrix.build_type }}
          path: c-api-${{ matrix.platform.name }}-${{ matrix.build_type }}.tar.gz
          if-no-files-found: error
          retention-days: 14
