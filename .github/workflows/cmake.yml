name: CMake

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      update_benchmark_docs:
        description: Measure on the default branch and create a benchmark documentation PR
        type: boolean
        default: false

permissions:
  contents: read

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release
  CXX: g++-15

jobs:
  build:
    name: Linux x64 / ${{ matrix.build_type }} / legacy=${{ matrix.legacy_tests }}
    env:
      BUILD_TYPE: ${{ matrix.build_type }}
    # The CMake configure and build commands are platform agnostic and should work equally well on Windows or Mac.
    # You can convert this to a matrix build if you need cross-platform coverage.
    # See: https://docs.github.com/en/free-pro-team@latest/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04]
        cpp_version: [23]
        legacy_tests: ["OFF", "ON"]
        build_type: [Debug, Release]

    steps:
      - name: Check out repository code
        uses: actions/checkout@v7

      - name: Initialize legacy comparison dependency
        if: matrix.legacy_tests == 'ON'
        run: git submodule update --init deps/cppjieba

      - name: Install C++23 compiler
        run: sudo apt-get update && sudo apt-get install -y g++-15

      - name: Configure CMake
        # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
        # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
        # run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}
        run: cmake -B ${{github.workspace}}/build -DBUILD_TESTING=ON -DCPPJIEBA_BUILD_LEGACY_TESTS=${{matrix.legacy_tests}} -DCPPJIEBA_BUILD_BENCHMARKS=OFF -DCMAKE_CXX_STANDARD=${{matrix.cpp_version}} -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}

      - name: Check unit-test isolation
        run: |
          test ! -d build/benchmark
          if [ "${{matrix.legacy_tests}}" = "OFF" ]; then
            test ! -d build/deps
          fi

      - name: Build
        # Build your program with the given configuration
        # run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}
        run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}} --parallel 2

      - name: Test
        working-directory: ${{github.workspace}}/build
        # Execute tests defined by the CMake configuration.
        # See https://cmake.org/cmake/help/latest/manual/ctest.1.html for more detail
        run: ctest -C ${{env.BUILD_TYPE}} --output-on-failure --output-junit unit-tests.xml

      - name: Upload unit-test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ut-linux-x64-${{ matrix.build_type }}-legacy-${{ matrix.legacy_tests }}
          path: |
            build/unit-tests.xml
            build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
          retention-days: 14

  benchmarks:
    name: Release benchmarks / Rust=${{ matrix.rust }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      RUSTUP_TOOLCHAIN: "1.99.0"
      UPDATE_BENCHMARK_DOCS: ${{ github.event_name == 'workflow_dispatch' && inputs.update_benchmark_docs && github.ref_name == github.event.repository.default_branch }}
    strategy:
      fail-fast: false
      matrix:
        rust: ["OFF", "ON"]
    steps:
      - uses: actions/checkout@v7
      - name: Initialize comparison dependency
        run: git submodule update --init deps/cppjieba deps/limonp
      - name: Initialize pinned Rust and Python jieba
        if: matrix.rust == 'ON'
        run: git submodule update --init deps/jieba-rs deps/python-jieba
      - name: Install C++23 compiler
        run: sudo apt-get update && sudo apt-get install -y g++-15
      - name: Set up Python
        if: matrix.rust == 'ON'
        uses: actions/setup-python@v7
        with:
          python-version: "3.14.8"
      - name: Install pinned Rust compiler
        if: matrix.rust == 'ON'
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --no-self-update
      - name: Configure standalone benchmarks
        run: >-
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=OFF -DCPPJIEBA_BUILD_BENCHMARKS=ON
          -DCPPJIEBA_BUILD_RUST_BENCHMARKS=${{matrix.rust}}
      - name: Check benchmark isolation
        run: |
          test ! -d build/test
          test ! -d build/_deps/googletest-src
      - name: Build
        run: cmake --build build --parallel 2
      - name: Record benchmark environment
        if: matrix.rust == 'ON'
        run: |
          mkdir -p benchmark/results/ci
          {
            git rev-parse HEAD
            git submodule status
            "$CXX" --version
            rustc --version --verbose
            cargo --version
            python --version
            cmake --version
            uname -a
            lscpu
          } > benchmark/results/ci/environment.txt
      - name: Record snapshot provenance
        if: matrix.rust == 'ON' && env.UPDATE_BENCHMARK_DOCS == 'true'
        env:
          BENCHMARK_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          BENCHMARK_RUNNER_IMAGE: ubuntu-26.04
        run: >-
          python docs/benchmarks/snapshot.py record-environment
          --build-directory build --output benchmark/results/ci/environment.json
      - name: Rust adapter unit tests
        if: matrix.rust == 'ON'
        run: >-
          cargo test --release --locked --manifest-path deps/rust-jieba/Cargo.toml
          --target-dir build/deps/rust-jieba/cargo
      - name: Python adapter unit tests
        if: matrix.rust == 'ON'
        run: python -B -m unittest discover -s benchmark -p 'python_compare_benchmark_test.py' -v
      - name: Benchmark snapshot unit tests
        if: matrix.rust == 'ON'
        run: python -B -m unittest discover -s docs/benchmarks -p '*_test.py' -v
      - name: Rust comparison smoke check
        if: matrix.rust == 'ON'
        working-directory: ${{runner.temp}}
        run: >-
          ${{github.workspace}}/build/benchmark/cut_compare_benchmark
          ${{github.workspace}}/dict/jieba.dict.utf8 ${{github.workspace}}/dict/hmm_model.utf8
          '' ${{github.workspace}}/test/testdata/testlines.utf8 1 1

      - name: Compare old C++, neo C++, Rust and Python
        if: matrix.rust == 'ON'
        run: |
          benchmark_cpu="$(python -c 'import os; print(min(os.sched_getaffinity(0)))')"
          printf 'benchmark_cpu=%s\n' "$benchmark_cpu" >> benchmark/results/ci/environment.txt
          for corpus in testlines weicheng; do
            if [ "$corpus" = testlines ]; then
              rounds=10000
            else
              rounds=3
            fi
            taskset -c "$benchmark_cpu" python -B benchmark/python_compare_benchmark.py \
              build/benchmark/cut_compare_benchmark \
              --text "test/testdata/$corpus.utf8" --rounds "$rounds" --samples 5 \
              --output "benchmark/results/ci/$corpus.json" \
              2>&1 | tee "benchmark/results/ci/$corpus.log"
          done

      - name: Generate benchmark documentation
        if: matrix.rust == 'ON' && env.UPDATE_BENCHMARK_DOCS == 'true'
        run: |
          python -m pip install matplotlib==3.11.2
          python docs/benchmarks/snapshot.py generate \
            --reports benchmark/results/ci --snapshot docs/benchmarks/snapshot.json --readme README.md
          python docs/benchmarks/plot.py docs/benchmarks/snapshot.json docs/benchmarks/comparison.svg
          git diff --check

      - name: Upload generated benchmark documentation
        if: matrix.rust == 'ON' && env.UPDATE_BENCHMARK_DOCS == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-documentation
          path: |
            README.md
            docs/benchmarks/snapshot.json
            docs/benchmarks/comparison.svg
          if-no-files-found: error
          retention-days: 14

      - name: Publish comparison summary
        if: always() && matrix.rust == 'ON'
        env:
          BENCHMARK_STATUS: ${{ job.status }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          TESTED_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p benchmark/results/ci
          {
            printf '## Old C++ / Neo C++ / Rust / Python\n\n'
            printf 'Benchmark job: **%s**. [Workflow and reports](%s).\n\n' "$BENCHMARK_STATUS" "$RUN_URL"
            printf 'Head: `%s`; tested commit: `%s`.\n\n' "$PR_HEAD_SHA" "$TESTED_SHA"
            printf 'Release, one CPU, five samples; timings are observations without a performance gate.\n\n'
            printf 'These results compare implementations, not this PR against its base branch.\n\n'
            for corpus in testlines weicheng; do
              printf '### %s\n\n' "$corpus"
              if [ -f "benchmark/results/ci/$corpus.md" ]; then
                cat "benchmark/results/ci/$corpus.md"
                printf '\n'
              else
                printf 'No completed benchmark report was produced; see the workflow log.\n\n'
              fi
            done
          } > benchmark/results/ci/summary.md
          cat benchmark/results/ci/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload comparison reports
        if: always() && matrix.rust == 'ON'
        uses: actions/upload-artifact@v7
        with:
          name: benchmarks-linux-x64-release
          path: benchmark/results/ci/
          if-no-files-found: ignore
          retention-days: 14

  benchmark-comment:
    name: Benchmark PR comment
    needs: benchmarks
    if: >-
      always() && !cancelled() && github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-26.04
    permissions:
      actions: read
      pull-requests: write
    steps:
      - name: Check that this is still the current PR head
        id: current
        uses: actions/github-script@v9
        with:
          script: |
            const { data: pull } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: context.issue.number,
            });
            return pull.state === 'open' && pull.head.sha === context.payload.pull_request.head.sha;

      - name: Download comparison reports
        if: steps.current.outputs.result == 'true'
        uses: actions/download-artifact@v8
        with:
          name: benchmarks-linux-x64-release
          path: benchmark-report

      - name: Update benchmark comment
        if: steps.current.outputs.result == 'true'
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: jieba-benchmark
          path: benchmark-report/summary.md

  benchmark-docs:
    name: Benchmark documentation PR
    needs: [build, benchmarks, library]
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.update_benchmark_docs &&
      github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Check that the measured revision is still current
        env:
          MEASURED_REVISION: ${{ github.sha }}
        run: |
          if [ "$(git rev-parse HEAD)" != "$MEASURED_REVISION" ]; then
            echo 'The default branch advanced during measurement; run the workflow again on its latest commit.' >&2
            exit 1
          fi
      - name: Download generated documentation
        uses: actions/download-artifact@v8
        with:
          name: benchmark-documentation
          path: .
      - name: Create or update the documentation PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: docs/benchmark-results
          base: ${{ github.event.repository.default_branch }}
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          commit-message: "docs: refresh benchmark results from GitHub Actions"
          title: "docs: refresh benchmark results from GitHub Actions"
          body: |
            Update the README benchmark section, numeric snapshot and chart from the same CI measurement.

            Measured commit: `${{ github.sha }}`.
            [Workflow, environment and raw reports](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).

            All four implementations ran serially on one CPU with five samples per case.
            The snapshot includes timing ranges, input hashes and token-sequence difference counts.
          add-paths: |
            README.md
            docs/benchmarks/snapshot.json
            docs/benchmarks/comparison.svg

  library:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Configure only the public library
        run: cmake -S . -B build -DBUILD_TESTING=OFF -DCPPJIEBA_BUILD_BENCHMARKS=OFF
      - name: Install public headers and data
        run: cmake --install build --prefix install
      - name: Check installation and dependency isolation
        run: |
          test -f install/include/neo/Jieba.hpp
          test -f install/share/cppjieba/dict/jieba.dict.utf8
          test ! -e install/include/cppjieba
          test ! -e install/include/limonp
          test ! -d build/deps
          test ! -d build/_deps
